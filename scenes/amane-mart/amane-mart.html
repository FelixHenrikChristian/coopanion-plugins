<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1d">
  <meta name="description" content="雨音マート。细雨中的日式便利店街角，一座可以旋转、缩放的三维微缩景观。">
  <title>灯影横丁 · 雨庭レジデンス</title>
  <style>
    *{box-sizing:border-box}
    html,body,main{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:linear-gradient(180deg,#091122,#272639 31%,#111425 54%,#050813 89%);color-scheme:dark}
    main{position:relative;isolation:isolate}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none;-webkit-tap-highlight-color:transparent}
    canvas.moving,canvas:active{cursor:grabbing}
    ::selection{background:transparent}
    #house-toggle{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:10px;min-height:42px;padding:0 15px;border:1px solid #e8dec348;border-radius:9px;color:#f9edda;background:rgba(24,33,43,.92);font:500 13px/1.15 system-ui,"Microsoft YaHei",sans-serif;letter-spacing:.025em;cursor:pointer;box-shadow:0 3px 16px #0005;touch-action:manipulation}
    #house-toggle:hover{border-color:#f6ce8b99;background:#303e48}
    #house-toggle:focus-visible{outline:2px solid #f3cc8d;outline-offset:3px}
    #house-toggle svg{width:20px;height:20px;stroke:#e9bd80;fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
    #house-toggle:not([data-mode="exterior"]) .roof-stroke,#house-toggle[data-mode="open"] .wall-stroke{opacity:.22;stroke-dasharray:2 2}
    .view-step{font:500 10px/1 ui-monospace,monospace;color:#c7bbab;border-left:1px solid #ffffff25;padding-left:9px}
    @media(max-width:600px){#house-toggle{right:12px;bottom:max(12px,env(safe-area-inset-bottom));min-height:44px}}
  </style>
</head>
<body>
  <main aria-label="雨夜街角三维微缩景观">
    <canvas tabindex="0" role="application" aria-label="雨音マート。拖拽旋转，滚轮缩放，右键拖拽平移。触屏可用双指缩放和平移。键盘方向键旋转，加减键缩放，Home 返回初始视角。">雨夜中的日式便利店，暖色灯光穿过橱窗，在积水街面留下倒影。</canvas>
    <button id="house-toggle" type="button" data-mode="exterior" aria-label="小屋视图：完整外观。切换至全部墙面" title="小屋视图：完整外观。切换至全部墙面">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path class="roof-stroke" d="m2.8 10 8.3-6.4L21 8.8l-7.2 5.1z"/><path class="wall-stroke" d="M4.9 11v7l8.8 3.1 5.3-4v-7M13.7 14v7"/><path d="m4.9 18 8.8 3.1 5.3-4"/></svg>
      <span class="view-name" aria-live="polite">完整外观</span><span class="view-step" aria-hidden="true">1 / 4</span>
    </button>
  </main>
